version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cloudsphere-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahith2526}
      POSTGRES_DB: ${POSTGRES_DB:-cloudsphere}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cloudsphere-backend
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-sahith2526}@db:5432/${POSTGRES_DB:-cloudsphere}
      - JWT_SECRET=${JWT_SECRET:-cloudsphere_secret_key}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}

  frontend:
    build:
      context: ./Frontend/my-react-app
      dockerfile: Dockerfile
    container_name: cloudsphere-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
