<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>CloudSphere - Secure Cloud Storage & File Sharing</title>
    <meta name="title" content="CloudSphere - Secure Cloud Storage & File Sharing" />
    <meta name="description" content="CloudSphere is a modern, secure, and blazing-fast cloud storage solution. Upload, organize, and share your files seamlessly from anywhere." />
    <meta name="keywords" content="cloud storage, file sharing, secure drive, cloudsphere, online storage" />
    <meta name="author" content="CloudSphere" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CloudSphere - Secure Cloud Storage & File Sharing" />
    <meta property="og:description" content="CloudSphere is a modern, secure, and blazing-fast cloud storage solution. Upload, organize, and share your files seamlessly from anywhere." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="CloudSphere - Secure Cloud Storage & File Sharing" />
    <meta property="twitter:description" content="CloudSphere is a modern, secure, and blazing-fast cloud storage solution. Upload, organize, and share your files seamlessly from anywhere." />
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
  </head>

    <div id="root"></div>

  </body>
